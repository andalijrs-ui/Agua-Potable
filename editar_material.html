<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Material</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h3 class="mb-4 text-primary">✏️ Editar Material</h3>
  <form method="POST">
    <div class="row">
      <div class="col-md-4">
        <label class="form-label">FAM</label>
        <input type="text" name="fam" class="form-control" value="{{ material.fam }}" readonly>
      </div>
      <div class="col-md-4">
        <label class="form-label">GPO</label>
        <input type="text" name="gpo" class="form-control" value="{{ material.gpo }}" >
      </div>
      <div class="col-md-4">
        <label class="form-label">MAT</label>
        <input type="text" name="codigoMat" class="form-control" value="{{ material.mat }}" >
      </div>
    </div>

    <div class="mb-3 mt-3">
      <label class="form-label">Nombre del Material</label>
      <input type="text" name="material" class="form-control" value="{{ material.nombre }}">
    </div>

    <div class="row">
      <div class="col-md-6">
        <label class="form-label">U.M. Compra</label>
        <input type="text" name="umCompra" class="form-control" value="{{ material.um_compra }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">U.M. Salida</label>
        <input type="text" name="umSalida" class="form-control" value="{{ material.um_salida }}">
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-4">
        <label class="form-label">Cantidad x U.M.</label>
        <input type="number" step="0.01" name="cantidadUnidad" class="form-control" value="{{ material.cantidad_unidad }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Existencias</label>
        <input type="number" name="existencias" class="form-control" value="{{ material.existencias }}">
      </div>
      <div class="col-md-4 d-flex align-items-center">
        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" name="inventariado" {% if material.inventariado %}checked{% endif %}>
          <label class="form-check-label fw-bold text-primary">Inventariado</label>
        </div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-4">
        <label class="form-label">Precio Compra</label>
        <input type="number" step="0.01" name="precioCompra" class="form-control" value="{{ material.precio_compra }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Precio Unitario</label>
        <input type="number" step="0.01" name="precioSalida" class="form-control" value="{{ material.precio_salida }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Precio al Usuario</label>
        <input type="number" step="0.01" name="precioPublico" class="form-control" value="{{ material.precio_publico }}">
      </div>
    </div>

    <div class="mt-4 text-end">
      <button type="submit" class="btn btn-primary">💾 Actualizar</button>
      <a href="{{ url_for('form_material') }}" class="btn btn-secondary">↩️ Cancelar</a>
    </div>
  </form>
</div>
</body>
</html>
