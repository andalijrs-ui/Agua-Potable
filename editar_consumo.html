{% extends "base.html" %}
{% block titulo %}✏️ Editar Consumo{% endblock %}
{% block contenido %}
<div class="container mt-4">
  <h2 class="mb-3 text-primary text-center">✏️ Editar Consumo</h2>

  <form method="POST" class="row g-3">
    <div class="col-md-2">
      <label>Tipo de Uso</label>
      <select name="tipo_uso" class="form-select" required>
        <option value="Domestico" {% if consumo.tipo_uso == 'Domestico' %}selected{% endif %}>Doméstico</option>
        <option value="Comercial" {% if consumo.tipo_uso == 'Comercial' %}selected{% endif %}>Comercial</option>
        <option value="Industrial" {% if consumo.tipo_uso == 'Industrial' %}selected{% endif %}>Industrial</option>
      </select>
    </div>

    <div class="col-md-2">
      <label>Cuota Fija</label>
      <input type="number" step="0.01" name="cuota_fija" value="{{ consumo.cuota_fija }}" class="form-control" required>
    </div>

    {% for rango in ['medio', 'alto', 'maximo', 'excesivo', 'aaa'] %}
  <div class="col-md-2">
    <label>Consumo {{ rango|capitalize }}</label>
    <input type="number" step="0.01" name="consumo_{{ rango }}" value="{{ consumo['consumo_' ~ rango] }}" class="form-control">
  </div>
  <div class="col-md-2">
    <label>Precio {{ rango|capitalize }}</label>
    <input type="number" step="0.01" name="precio_{{ rango }}" value="{{ consumo['precio_' ~ rango] }}" class="form-control">
  </div>
{% endfor %}

    <div class="col-md-2">
      <label>% Interés Moratorio</label>
      <input type="number" step="0.01" name="ptje_int_moratorio" value="{{ consumo.ptje_int_moratorio * 100 }}" class="form-control">
    </div>

    <div class="col-md-2">
      <label>Días de Tolerancia</label>
      <input type="number" name="dias_tolerancia" value="{{ consumo.dias_tolerancia }}" class="form-control">
    </div>

    <div class="col-md-2">
      <label>Día Límite de Pago</label>
      <input type="number" name="dia_limite_pago" value="{{ consumo.dia_limite_pago }}" class="form-control">
    </div>

    <div class="col-md-12 text-end">
      <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
      <a href="{{ url_for('nuevo_consumo') }}" class="btn btn-outline-secondary">🔙 Volver</a>
    </div>
  </form>
</div>
{% endblock %}
