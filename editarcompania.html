{% extends 'base.html' %}

{% block titulo %}Editar Compañía{% endblock %}

{% block contenido %}
<h2 class="mb-4 text-center">Editar Compañía</h2>

{% if mensaje %}
  <div class="alert alert-warning text-center">{{ mensaje }}</div>
{% endif %}

<form method="POST" class="card p-4 shadow-sm needs-validation" novalidate>
  <div class="mb-3">
    <label for="numero" class="form-label">Número de Compañía</label>
    <input type="text" class="form-control" id="numero" name="numero" value="{{ compania.numero }}" required>
  </div>

  <div class="mb-3">
    <label for="nombre" class="form-label">Nombre de Compañía</label>
    <input type="text" class="form-control" id="nombre" name="nombre" value="{{ compania.nombre }}" required>
  </div>

  <div class="d-flex justify-content-between">
    <button type="submit" class="btn btn-primary">💾 Guardar</button>
    <a href="{{ url_for('agregar_compania') }}" class="btn btn-outline-secondary">🔙 Salir</a>
  </div>
</form>
{% endblock %}
